name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    name: Node ${{ matrix.node }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Windows porque es donde corre la mayoría de los clientes MCP de
        # escritorio, y el confinamiento de informes depende de las rutas.
        os: [ubuntu-latest, windows-latest]
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Tipos
        run: npx tsc --noEmit

      - name: Lint (incluye no-floating-promises)
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Tests (incluye la prueba de humo por protocolo MCP)
        run: npm test

  dependencias:
    name: Vulnerabilidades en producción
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Solo las dependencias que viajan en el paquete publicado.
      - run: npm audit --omit=dev --audit-level=high
